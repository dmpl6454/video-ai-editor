[project]
name = "video-ai-editor"
version = "0.7.1"
description = "Local AI video editor — chat-driven, CapCut-class"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "python-multipart>=0.0.9",
    "pydantic>=2.8",
    "anthropic>=0.40",
    "faster-whisper>=1.0",
    "ffmpeg-python>=0.2",
    "pillow>=10.0",
    "numpy>=1.26",
    "sse-starlette>=2.1",
    "aiofiles>=24.0",
    "librosa>=0.11.0",
    "piper-tts>=1.4.2",
    "mediapipe>=0.10.35",
    "demucs>=4.0.1",
    "pywebview>=6.2.1",
    "torchcodec>=0.11.1",
    "ctranslate2>=4.0",
    "sentencepiece>=0.2.0",
    "huggingface-hub>=0.21",
    "simple-lama-inpainting>=0.1.0",
    "rembg>=2.0.75",
    "noisereduce>=3.0.3",
    "soundfile>=0.13.1",
    "pyannote-audio>=4.0.4",
    "open-clip-torch>=3.3.0",
    "pyobjc-framework-avfoundation>=11.0; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]
# The on-device planning brain for the Prompt bar (docs/PROMPT_EDITOR.md).
# An EXTRA, not a group, because it is per-machine capability rather than a
# dev-only tool: `uv sync --extra local-llm` on an Apple-silicon Mac installs
# mlx-lm, and `agent/prompt/brains/mlx_brain.py` imports it lazily so a
# checkout without the extra still runs and `brains_report()` says exactly
# what is missing ("not installed (pip)") instead of raising at import.
# Pinned exactly: mlx-lm 0.31.x requires transformers>=5, which nothing else in
# this lock pulls, and a floating pin would let a routine `uv lock` move the
# model loader under the benchmark. The environment markers keep the lock
# resolvable on ubuntu/windows CI, where the extra is simply empty.
local-llm = [
    "mlx-lm==0.31.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
# heavier AI deps loaded on demand in later milestones
ai = [
    "movis>=0.7",
    "librosa>=0.10",
    "opencv-python>=4.10",
    "mediapipe>=0.10",
    "noisereduce>=3.0",
    "rembg>=2.0",
]

[project.scripts]
video-ai-editor = "video_ai_editor.desktop:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/video_ai_editor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
# The CapCut-parity benchmark (tests/benchmark/, docs/BENCHMARK.md) transcribes
# real synthesized media and runs 24 prompts end to end — minutes, not seconds,
# and it needs the whisper model on disk. It is excluded from the default run
# by marker; `pytest -m benchmark` opts in (a command-line -m replaces this
# one). `tests/benchmark/test_media_synthesis.py` is deliberately UNMARKED so
# the media pipeline itself stays covered by every default run.
addopts = "-m 'not benchmark'"
markers = [
    "benchmark: end-to-end CapCut-parity benchmark on real media (opt in with -m benchmark)",
    "slow: slow-tier benchmark case (shorts, reframe, full pipeline, 12-minute clip)",
    "tts: needs a Hindi TTS voice (Piper hi_IN or macOS `say -v Lekha`) to synthesize its fixture",
]

[dependency-groups]
dev = [
    "playwright>=1.59.0",
    "py2app>=0.28.10",
    "pyinstaller>=6.20.0",
]
# GPU transcription. ctranslate2 (faster-whisper's engine) needs CUDA's math
# libraries, and the DRIVER ALONE IS NOT ENOUGH: on a machine with an RTX 4050
# and no cuBLAS, `WhisperModel(device="cuda")` loads fine and then dies on the
# first forward pass with "Library cublas64_12.dll is not found or cannot be
# loaded" — minutes into a caption job.
#
# Worth the ~1.3GB. Measured on 60s of Hindi with large-v3, both batched:
# decode went from 95.2s on CPU int8 to 8.4s on CUDA float16 — 11.3x — for the
# SAME transcript (128 words, 294 Devanagari chars, identical text). A 3-minute
# video goes from ~9.3 minutes as shipped to ~25 seconds. It is the only speed
# lever measured here that costs nothing in accuracy, because it is the same
# weights on a different device.
#
# A GROUP, not an extra, on purpose: `uv sync --all-extras` is the documented dev
# setup, and an extra would silently add 1.3GB of NVIDIA wheels to every Windows
# and Linux checkout including machines with no NVIDIA card. Groups are opt-in
# (`uv sync --group cuda`) and `--all-extras` does not pull them. Excluded on
# darwin because ctranslate2 has no Metal backend — a Mac always uses CPU.
# `ai.features.feature_report()` reports whether it actually took effect, and
# `ingest.transcribe._add_cuda_dll_dirs` handles the fact that these wheels drop
# their DLLs somewhere on no Windows search path at all.
cuda = [
    "nvidia-cublas-cu12; sys_platform != 'darwin'",
    "nvidia-cudnn-cu12>=9,<10; sys_platform != 'darwin'",
]
