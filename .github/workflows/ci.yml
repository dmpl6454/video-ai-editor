name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs on the same PR/branch when a new push lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (pytest, ubuntu ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      # Tests that need network or proprietary models skip cleanly when these
      # are unset; we make sure the env is empty here so CI never hits a real
      # Anthropic / HuggingFace endpoint.
      ANTHROPIC_API_KEY: ""
      HUGGINGFACE_TOKEN: ""
    steps:
      - uses: actions/checkout@v4

      # Pinned to ffmpeg 8, the oldest major the app supports (8 and 9; macOS
      # and Windows below run the package managers' current 9.x). ubuntu's apt
      # ffmpeg is 6.1.1, and in run 36599751632 that build alone accounted for
      # 33 of this job's 54 failures (empty ducked audio, BT.601 canvas
      # colours), which buried the ones that are about the app.
      #
      # Homebrew's versioned formula, because it is the channel the README
      # documents and it publishes an x86_64_linux bottle (8.1.3, checked on
      # formulae.brew.sh/api/formula/ffmpeg@8.json). brew is preinstalled on
      # the ubuntu images under /home/linuxbrew/.linuxbrew but is not on PATH.
      # It is the slim build, like `brew install ffmpeg` on macOS: no libass,
      # freetype, rubberband, vidstab or zimg, so the same tests skip.
      - name: Resolve the ffmpeg 8 bottle
        id: ffmpeg8
        run: |
          BREW=/home/linuxbrew/.linuxbrew/bin/brew
          [ -x "$BREW" ] || { echo "::error::Homebrew is not preinstalled at $BREW on this image"; exit 1; }
          # The bottle's sha256 changes with every rebuild of the formula,
          # which is also when its dependencies move, so it keys the cache
          # exactly. If the API cannot be read the install still works, only
          # uncached, under a key that expires with the ISO week.
          sha=$(curl -fsSL --retry 3 https://formulae.brew.sh/api/formula/ffmpeg@8.json \
                | jq -r '.bottle.stable.files.x86_64_linux.sha256 // empty') || sha=""
          [ -n "$sha" ] || sha="unresolved-$(date -u +%G%V)"
          echo "bottle=$sha" >> "$GITHUB_OUTPUT"
          echo "cache=$("$BREW" --cache)" >> "$GITHUB_OUTPUT"

      - name: Cache the Homebrew downloads
        # Only the downloaded bottles (ffmpeg@8 and its 14 dependencies), so
        # eight shards do not each fetch them from ghcr.io. brew checks every
        # cached bottle's sha256 before it pours it, so a stale or damaged
        # entry costs a download and nothing else. The installed kegs are NOT
        # cached: restoring them under a newer brew is how a pin goes wrong.
        uses: actions/cache@v4
        with:
          path: ${{ steps.ffmpeg8.outputs.cache }}
          key: brew-ffmpeg8-${{ runner.os }}-${{ runner.arch }}-${{ steps.ffmpeg8.outputs.bottle }}
          restore-keys: |
            brew-ffmpeg8-${{ runner.os }}-${{ runner.arch }}-

      - name: Install ffmpeg 8 (Homebrew)
        env:
          HOMEBREW_NO_ANALYTICS: "1"
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_ENV_HINTS: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
        run: |
          BREW=/home/linuxbrew/.linuxbrew/bin/brew
          # One explicit update (the image's formula index can predate the
          # current bottle), then no implicit ones. Retried for the same
          # reason the Windows install is: a transient registry error must not
          # cost the only Linux gate. `brew install` of an installed formula
          # exits 0, so a retry is safe.
          "$BREW" update --quiet || echo "brew update failed; installing from the image's index"
          ok=0
          for i in 1 2 3; do
            if "$BREW" install --quiet ffmpeg@8; then ok=1; break; fi
            echo "brew install ffmpeg@8 failed, attempt $i/3, retrying in 20s"
            sleep 20
          done
          [ "$ok" = "1" ] || { echo "::error::brew install ffmpeg@8 failed after 3 attempts"; exit 1; }
          # keg-only: nothing is linked into brew's bin, so only ffmpeg's own
          # bin goes on PATH and brew's python, git and curl stay off it.
          bin="$("$BREW" --prefix ffmpeg@8)/bin"
          [ -x "$bin/ffmpeg" ] && [ -x "$bin/ffprobe" ] || { echo "::error::no ffmpeg/ffprobe in $bin"; exit 1; }
          echo "$bin" >> "$GITHUB_PATH"

      - name: Report ffmpeg
        # Which ffmpeg pytest will resolve (.github/scripts/report-ffmpeg.sh).
        # This job is pinned: the step fails on any other major.
        shell: bash
        env:
          FFMPEG_REQUIRED_MAJOR: "8"
        run: bash .github/scripts/report-ffmpeg.sh

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Sync dependencies
        # `--extra dev` pulls pytest + httpx (declared under
        # [project.optional-dependencies].dev). The `[dependency-groups].dev`
        # group (playwright, py2app, pyinstaller) is auto-included by default.
        run: uv sync --frozen --extra dev

      - name: Run pytest (shard ${{ matrix.shard }} of ${{ strategy.job-total }})
        # The suite outgrew one runner: ~7,800 tests, and the 0.8.0 push ran
        # about 60 tests/min on ubuntu (over two hours single-process), so the
        # job was killed at its budget. Shard by file, round-robin over the
        # sorted list: every shard is deterministic and the union is exactly
        # `pytest tests` (testpaths); addopts' `-m 'not benchmark'` still applies.
        shell: bash
        run: |
          files=$(find tests -name 'test_*.py' | sort | awk -v n="${{ matrix.shard }}" -v k="${{ strategy.job-total }}" 'NR % k == n % k')
          echo "$(echo "$files" | wc -l | tr -d ' ') test files in shard ${{ matrix.shard }}/${{ strategy.job-total }}"
          uv run pytest -q --tb=short --durations=10 $files
        # Heavy-AI tests (RIFE, Real-ESRGAN, LaMa, pyannote) skip cleanly on
        # CI because the binaries / models aren't installed — that's by design.

  backend-windows:
    name: backend (pytest, windows ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      ANTHROPIC_API_KEY: ""
      HUGGINGFACE_TOKEN: ""
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg (Chocolatey)
        run: |
          # Retried on purpose. The community.chocolatey.org V2 feed returns 504
          # often enough that it took out TWO of three Windows runs during the
          # round-5 verification — and per CLAUDE.md this job is the only gate
          # for Windows behaviour, so losing it to a transient feed error means
          # losing the ability to verify Windows at all. `choco install` is
          # idempotent (already-installed exits 0), so retrying is safe.
          #
          # $LASTEXITCODE is checked explicitly because
          # `$ErrorActionPreference='Stop'` does NOT trip on a native exe's
          # non-zero exit — the same trap build_win.ps1 documents.
          $ok = $false
          foreach ($i in 1..4) {
            choco install ffmpeg-full -y --no-progress
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            Write-Host "choco install failed (exit $LASTEXITCODE) — attempt $i/4, retrying in 30s"
            Start-Sleep -Seconds 30
          }
          if (-not $ok) { throw "choco install ffmpeg-full failed after 4 attempts" }
        shell: pwsh

      - name: Report ffmpeg
        # Which ffmpeg pytest will resolve (.github/scripts/report-ffmpeg.sh).
        # No required major: this job follows the package manager's ffmpeg.
        shell: bash
        env:
          FFMPEG_REQUIRED_MAJOR: ""
        run: bash .github/scripts/report-ffmpeg.sh

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Sync dependencies
        run: uv sync --frozen --extra dev
        # Note: py2app (dependency-group dev) installs but is mac-only dead code.

      - name: Run pytest (shard ${{ matrix.shard }} of ${{ strategy.job-total }})
        # The suite outgrew one runner: ~7,800 tests, and the 0.8.0 push ran
        # about 60 tests/min on ubuntu (over two hours single-process), so the
        # job was killed at its budget. Shard by file, round-robin over the
        # sorted list: every shard is deterministic and the union is exactly
        # `pytest tests` (testpaths); addopts' `-m 'not benchmark'` still applies.
        shell: bash
        run: |
          files=$(find tests -name 'test_*.py' | sort | awk -v n="${{ matrix.shard }}" -v k="${{ strategy.job-total }}" 'NR % k == n % k')
          echo "$(echo "$files" | wc -l | tr -d ' ') test files in shard ${{ matrix.shard }}/${{ strategy.job-total }}"
          uv run pytest -q --tb=short --durations=10 $files
        # Heavy-AI tests skip cleanly (no binaries/models on the runner).

  backend-macos:
    name: backend (pytest, macos ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: macos-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      ANTHROPIC_API_KEY: ""
      HUGGINGFACE_TOKEN: ""
    steps:
      - uses: actions/checkout@v4

      # macOS is a SHIPPING platform for this app — it is the primary one (the
      # .app bundle, the pywebview/WKWebView front end, the VideoToolbox
      # encoder ladder, the `.pth` hidden-flag launch quirk) — and until this
      # job existed there was no automated gate for it at all: CI ran ubuntu +
      # windows only. Every macOS claim rested on reading the code. ubuntu
      # covers POSIX path/encoding semantics but not Darwin-specific paths
      # (`~/Library/Application Support`, `exe_name` no-op, avfoundation,
      # VideoToolbox probing), which is exactly where platformutil branches.
      - name: Install ffmpeg
        run: |
          # The runner image may already carry an ffmpeg, and `brew install` on
          # an already-installed formula can exit non-zero on a link conflict —
          # which would fail the job over a working toolchain. The real gate is
          # whether ffmpeg RUNS, so assert that instead of trusting brew's exit
          # code. The version is printed by the next step.
          brew install ffmpeg || echo "brew install exited non-zero — falling back to any preinstalled ffmpeg"
          ffmpeg -version > /dev/null 2>&1 || { echo "::error::no usable ffmpeg on this runner"; exit 1; }

      - name: Report ffmpeg
        # Which ffmpeg pytest will resolve (.github/scripts/report-ffmpeg.sh).
        # No required major: this job follows the package manager's ffmpeg.
        shell: bash
        env:
          FFMPEG_REQUIRED_MAJOR: ""
        run: bash .github/scripts/report-ffmpeg.sh

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Sync dependencies
        run: uv sync --frozen --extra dev

      - name: Run pytest (shard ${{ matrix.shard }} of ${{ strategy.job-total }})
        # The suite outgrew one runner: ~7,800 tests, and the 0.8.0 push ran
        # about 60 tests/min on ubuntu (over two hours single-process), so the
        # job was killed at its budget. Shard by file, round-robin over the
        # sorted list: every shard is deterministic and the union is exactly
        # `pytest tests` (testpaths); addopts' `-m 'not benchmark'` still applies.
        shell: bash
        run: |
          files=$(find tests -name 'test_*.py' | sort | awk -v n="${{ matrix.shard }}" -v k="${{ strategy.job-total }}" 'NR % k == n % k')
          echo "$(echo "$files" | wc -l | tr -d ' ') test files in shard ${{ matrix.shard }}/${{ strategy.job-total }}"
          uv run pytest -q --tb=short --durations=10 $files
        # Same as the other backend jobs: heavy-AI tests skip cleanly because
        # the binaries/models aren't on the runner. `brew install ffmpeg` (not
        # ffmpeg-full) has no libvidstab, so `stabilize` skips too — that is
        # the documented degrade-don't-crash path, and a test asserting it is
        # more valuable than a 10-minute source build of ffmpeg-full.

      # pytest proves the LOGIC imports and behaves; it never boots the app.
      # This step proves the process actually RUNS on macOS: every module
      # imports together under a real ASGI server, uvicorn binds, and the app's
      # own readiness probe finds ffmpeg (`/readyz` is 503 when it does not).
      # It is the closest thing to "did it launch" that a headless runner can
      # assert — the native window (WKWebView) and the .app bundle still need a
      # human on a Mac.
      #
      # PYTHONPATH=src is deliberate and mirrors run.sh: on macOS an editable
      # install's .pth can be flagged hidden by Spotlight's mdflagwriter, and
      # Python 3.13+ skips hidden .pth files — the documented launch gotcha.
      # Going through PYTHONPATH bypasses that mechanism entirely, so this step
      # tests the app rather than the runner's Spotlight state.
      - name: Boot the backend (execution smoke test)
        if: matrix.shard == 1
        env:
          PYTHONPATH: src
        run: |
          uv run python -m uvicorn video_ai_editor.main:app \
            --host 127.0.0.1 --port 8765 --log-level warning &
          pid=$!
          ok=0
          for _ in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8765/api/health > /dev/null 2>&1; then ok=1; break; fi
            sleep 1
          done
          if [ "$ok" != "1" ]; then
            echo "::error::backend never answered /api/health on macOS"
            kill $pid 2>/dev/null || true
            exit 1
          fi
          echo "health : $(curl -fsS http://127.0.0.1:8765/api/health)"
          echo "version: $(curl -fsS http://127.0.0.1:8765/api/version)"
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8765/readyz)
          echo "readyz : $code"
          kill $pid 2>/dev/null || true
          if [ "$code" != "200" ]; then
            echo "::error::/readyz returned $code — the app could not find a usable ffmpeg"
            exit 1
          fi

  frontend:
    name: frontend (tsc + vite build)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      # MUST be `tsc -b`, not `tsc --noEmit`. frontend/tsconfig.json is a
      # solution file (`"files": []` + `references`), so plain `tsc` builds a
      # program of ZERO files and exits 0 — verified with `--listFiles`. Only
      # build mode walks into tsconfig.app.json / tsconfig.node.json. The old
      # `--noEmit` gate is why 4 real type errors sat on main undetected while
      # `npm run build` (which desktop.py and build_win.ps1 both run) failed.
      - name: Type-check
        run: npx tsc -b --force

      - name: Unit tests
        run: npx vitest run

      - name: Build
        run: npx vite build

      - name: Upload bundle as artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ github.sha }}
          path: frontend/dist
          retention-days: 7
