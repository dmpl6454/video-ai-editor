<!doctype html><meta charset="utf-8"><title>tab focus</title>
<body>
<input id="field" type="text" aria-label="Name">
<button id="import">Import</button>
<button id="export">Export</button>
<label><input id="keep" type="checkbox"> Keep pitch</label>
<button id="split">Split</button>
<textarea id="notes" aria-label="Notes"></textarea>
<script>
// The Tab stops a keyboard user reaches in THIS WKWebView (test_wk_tab_focus.py,
// review RD3): wk_keys_child.py plays native Tab key events; after each one the
// focused element's id is logged.
const q = new URLSearchParams(location.search)
const log = []
document.addEventListener('keyup', (e) => {
  if (e.key === 'Tab') log.push(document.activeElement ? (document.activeElement.id || document.activeElement.tagName) : null)
}, true)
window.__focus = (id) => { if (id) document.getElementById(id).focus(); return document.activeElement && document.activeElement.id }
window.__keysDone = () => fetch('/__result/' + q.get('token'), { method: 'POST', body: JSON.stringify({ log, ua: navigator.userAgent }) })
window.__keysReady = true
</script>
</body>
